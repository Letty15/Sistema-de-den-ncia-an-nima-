<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Conteúdos Educativos</title>
</head>
<body>
    <h1>Conteúdos Publicados</h1>

    <table cellpadding="8" cellspacing="0" border="1">
        <thead>
            <tr>
                <th>Título</th>
                <th>Categoria</th>
                <th>Publicado em</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            {% for conteudo in conteudos %}
            <tr>
                <td>{{ conteudo.titulo }}</td>
                <td>{{ conteudo.get_categoria_display }}</td>
                <td>{{ conteudo.publicado_em }}</td>
                <td>
                    <a href="{% url 'detalhar_conteudo' pk=conteudo.pk %}">Ver</a> |
                    <a href="{% url 'editar_conteudo' pk=conteudo.pk %}">Editar</a> |
                    <a href="{% url 'deletar_conteudo' pk=conteudo.pk %}">Excluir</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4">Nenhum conteúdo publicado ainda.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <p><a href="{% url 'novo_conteudo' %}">Publicar novo conteúdo</a></p>
</body>
</html>
