<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar Canal</title>

    <style>
        h1 {
            color: #f56a93;
        }
        body {
            color: #000000;
        }
        form {
            width: 400px;
            margin-top: 20px;
        }
        form p {
            margin-bottom: 14px;
            font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        }
        label {
            display: block;
            margin-bottom: 4px;
            font-weight: bold;
        }
        input, select, textarea {
            width: 100%;
            padding: 6px;
            border: 1px solid #c0bebe;
            border-radius: 4px;
            font-family: inherit;
            font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        }
        textarea {
            min-height: 100px;
        }
        button {
            background: #f56a93;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        }
        button:hover {
            opacity: 0.9;
        }
        .erro {
            color: #d33;
            font-size: 13px;
            font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        }
        .btn{
            margin-top: 10px;
            display: inline-block;
            padding: 8px 16px;
            background: #8152b5;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
            cursor: pointer;
            font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif; 
        }
        .btn:hover {
            background: #b995d4;
        }
    </style>
</head>
<body>

    <h1>Editar {{ canal.nome }}</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">
            Salvar alterações
        </button>
    </form>

    <a href="{% url 'listar_canal' %}" class="btn">Voltar</a>

</body>
</html>
