{% extends 'base.html' %}

{% block titulo %}Editar Canal{% endblock %}


{% block conteudo %}
    <h1>Editar {{ canal.nome }}</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">
            Salvar alterações
        </button>
    </form>

    <a href="{% url 'listar_canal' %}" class="btn">Voltar</a>
{% endblock %}
