{% extends 'base.html' %}

{% block titulo %}Editar Conteúdo{% endblock %}

{% block conteudo %}
    <h1>Editar Conteúdo</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Salvar alterações</button>
    </form>

    <p><a href="{% url 'detalhar_conteudo' pk=conteudo.pk %}">Cancelar</a></p> <!-- mudar pra listar depois -->
{% endblock %}
