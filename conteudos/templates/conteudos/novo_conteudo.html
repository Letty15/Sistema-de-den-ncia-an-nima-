{% extends 'base.html' %}

{% block titulo %}Novo Conteúdo{% endblock %}

{% block conteudo %}
    <h1>Publicar Conteúdo Educativo</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Publicar</button>
    </form>

    <p><a href="{% url 'listar_conteudo' %}">Ver conteúdos publicados</a></p>
{% endblock %}
