{% extends 'base.html' %}

{% block titulo %}Excluir Canal{% endblock %}


{% block conteudo %}
    <h1>Excluir "{{ canal.nome }}"?</h1>

    <p class="mensagem">
        Tem certeza que deseja excluir este canal de apoio?
    </p>

    <p class="alerta">
        Essa ação não pode ser desfeita.
    </p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">
            Confirmar exclusão
        </button>

    </form>

    <a href="{% url 'listar_canal' %}" class="btn">Voltar</a>
{% endblock %}
