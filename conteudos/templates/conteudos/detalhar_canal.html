{% extends 'base.html' %}

{% block titulo %}{{ canal.nome }}{% endblock %}


{% block conteudo %}
    <h1>{{ canal.nome }}</h1>
    <table cellpadding="8" cellspacing="0">
        <thead>
            <tr>
                <th>Contato</th>
                <th>Descrição</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>{{ canal.contato }}</td>
                <td>{{ canal.descricao }}</td>
            </tr>
        </tbody>
    </table>

    <a href="{% url 'listar_canal' %}" class="btn">Voltar</a>
{% endblock %}
