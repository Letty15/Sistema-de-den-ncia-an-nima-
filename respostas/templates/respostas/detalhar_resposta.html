<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Detalhes da resposta:</title>
    <style>
        .btn{
            display: inline-block;
            padding: 8px 16px;
            background: #8152b5;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
            cursor: pointer; 
            font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        }
        .btn:hover {
            background: #b995d4;
        }
        /* Linhas cinzas apenas embaixo das células */
        table td, table th {
            border-bottom: 1px solid #c0bebe;
        }
        /* Remove a borda da última linha */
        table tr:last-child td {
            border-bottom: none;
        }
        h1{
            color: #f56a93;
        }
        table {
            border: none;
            margin-top: 20px;
            width: 80%;
            border-collapse: collapse; /* garante que as bordas fiquem coladas */
            font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            color: #000000;
        }
        th {
            text-align: left;
        }
    </style>
</head>
<body>
    <h1>Resposta:</h1>

    <table cellpadding="8" cellspacing="0">
        <thead>
            <tr>
                <th>Protocolo da Denúncia</th>
                <th>Autor</th>
                <th>Mensagem</th>
                <th>Data</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>{{ resposta.denuncia.protocolo }}</td>
                <td>{{ resposta.autor.username }}</td>
                <td>{{ resposta.mensagem }}</td>
                <td>{{ resposta.data }}</td>  
        </tbody>
    </table>
    <a href="{% url 'listar_respostas' protocolo=denuncia.protocolo %}" class="btn">Voltar</a>
</body>
</html>
