{% extends 'base.html' %}

{% block titulo %}Detalhes da resposta{% endblock %}

{% block conteudo %}
    <h1>Resposta:</h1>

    <table cellpadding="8" cellspacing="0">
        <thead>
            <tr>
                <th>Protocolo da Denúncia</th>
                <th>Autor</th>
                <th>Mensagem</th>
                <th>Data</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>{{ resposta.denuncia.protocolo }}</td>
                <td>{{ resposta.autor.username }}</td>
                <td>{{ resposta.mensagem }}</td>
                <td>{{ resposta.data }}</td>
            </tr>
        </tbody>
    </table>
    <a href="{% url 'listar_respostas' protocolo=denuncia.protocolo %}" class="btn">Voltar</a>
{% endblock %}
