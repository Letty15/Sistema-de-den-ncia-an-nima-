<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Lista de Respostas</title>
    <style>
        /* Linhas cinzas apenas embaixo das células */
        table td, table th {
            border-bottom: 1px solid #c0bebe;
        }
        /* Remove a borda da última linha */
        table tr:last-child td {
            border-bottom: none;
        }
        h1{
            color: #f56a93;
        }
        table {
            border: none;
            margin-top: 20px;
            width: 80%;
            border-collapse: collapse; /* garante que as bordas fiquem coladas */
            font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            color: #000000;
        }
        th {
            text-align: left;
        }
    </style>
</head>
<body>
    <h1>Respostas relacionadas</h1>
    
    <table cellpadding="8" cellspacing="0">
        <thead>
            <tr>
                <th>Protocolo da Denúncia</th>
                <th>Autor</th>
                <th>Mensagem</th>
                <th>Data</th>
            </tr>
        </thead>
        <tbody>
            {% for resposta in respostas %}
            <tr>
                <td>{{ resposta.denuncia.protocolo }}</td>
                <td>{{ resposta.autor.username }}</td>
                <td>{{ resposta.mensagem }}</td>
                <td>{{ resposta.data }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4">Nenhuma resposta relacionada.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
