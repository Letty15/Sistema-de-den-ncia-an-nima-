{% extends 'base.html' %}

{% block titulo %}Nova Resposta{% endblock %}


{% block conteudo %}
    <h1>Registrar Resposta</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Salvar Resposta</button>
    </form>

    <a href="{% url 'listar_respostas' protocolo=denuncia.protocolo %}" class="btn">Voltar</a>
{% endblock %}
