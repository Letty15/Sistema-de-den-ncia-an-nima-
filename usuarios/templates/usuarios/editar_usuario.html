{% extends 'base.html' %}

{% block titulo %}Editar Usuário{% endblock %}

{% block conteudo %}
    <h1>Editar {{ usuario.username }}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Salvar</button>
    </form>
    <p><a href="{% url 'listar_usuario' %}">Cancelar</a></p>
{% endblock %}
