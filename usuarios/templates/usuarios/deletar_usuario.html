{% extends 'base.html' %}

{% block titulo %}Excluir Usuário{% endblock %}

{% block conteudo %}
    <h1>Excluir "{{ usuario.username }}"?</h1>
    <p>Essa ação não pode ser desfeita.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Confirmar exclusão</button>
    </form>
    <p><a href="{% url 'detalhar_usuario' pk=usuario.pk %}">Cancelar</a></p>
{% endblock %}
