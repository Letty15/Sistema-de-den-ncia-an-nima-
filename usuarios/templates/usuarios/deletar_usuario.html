{% extends 'base.html' %}
{% load static %}

{% block titulo %}Excluir Usuário{% endblock %}

{% block estilo %}<link rel="stylesheet" href="{% static 'css/conteudos-usuarios.css' %}">{% endblock %}

{% block conteudo %}
    <div class="vs-card vs-form-card text-center">
        <span class="vs-ico mx-auto mb-3" style="background:#FDE4E4;color:#B42318;"><i class="bi bi-person-x"></i></span>
        <h1 class="vs-title">Excluir usuário?</h1>
        <p class="vs-sub mb-0">
            A conta <strong>"{{ usuario.username }}"</strong> será apagada.
            Essa ação não pode ser desfeita.
        </p>

        <form method="post" class="d-flex flex-wrap justify-content-center gap-2 mt-4">
            {% csrf_token %}
            <button type="submit" class="vs-btn vs-btn-perigo">Confirmar exclusão</button>
            <a href="{% url 'detalhar_usuario' pk=usuario.pk %}" class="vs-btn vs-btn-outline">Cancelar</a>
        </form>
    </div>
{% endblock %}
