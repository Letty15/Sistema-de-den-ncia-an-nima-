{% extends 'base.html' %}

{% block titulo %}{{ usuario.username }}{% endblock %}

{% block conteudo %}
    <h1>{{ usuario.username }}</h1>
    <p><strong>Email:</strong> {{ usuario.email }}</p>
    <p><strong>CPF:</strong> {{ usuario.cpf }}</p>
    <p><strong>RG:</strong> {{ usuario.rg }}</p>
    <p><strong>Endereço:</strong> {{ usuario.endereco }}</p>
    <p>
        <a href="{% url 'editar_usuario' pk=usuario.pk %}">Editar</a> |
        <a href="{% url 'deletar_usuario' pk=usuario.pk %}">Excluir</a> |
        <a href="{% url 'listar_usuario' %}">Voltar à lista</a>
    </p>
{% endblock %}
