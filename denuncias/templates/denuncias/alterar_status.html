
{% extends 'base.html' %}

{% block titulo %}Alterar status da denúncia{% endblock %}

{% block conteudo %}
    <h1>Alterar status da denúncia</h1>

    <p><strong>Protocolo:</strong> {{ denuncia.protocolo }}</p>

    <p>
        <strong>Status atual:</strong>
        {{ denuncia.get_status_display }}
    </p>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Salvar alteração</button>
    </form>

    <a href="{% url 'detalhar_denuncia' protocolo=denuncia.protocolo %}">
        Voltar
    </a> 


{% endblock %}
