<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% if denuncia %}Editar Denúncia{% else %}Nova Denúncia{% endif %}</title>
    <style>
        h1 {
            color: #f56a93;
        }
        body {
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            color: #000000;
        }
        form {
            width: 400px;
            margin-top: 20px;
        }
        form p {
            margin-bottom: 14px;
        }
        label {
            display: block;
            margin-bottom: 4px;
            font-weight: bold;
        }
        input, select, textarea {
            width: 100%;
            padding: 6px;
            border: 1px solid #c0bebe;
            border-radius: 4px;
            font-family: inherit;
        }
        textarea {
            min-height: 100px;
        }
        button {
            background: #f56a93;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            opacity: 0.9;
        }
        .erro {
            color: #d33;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <h1>{% if denuncia %}Editar Denúncia {{ denuncia.protocolo }}{% else %}Registrar Denúncia{% endif %}</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">{% if denuncia %}Salvar alterações{% else %}Enviar Denúncia{% endif %}</button>
    </form>

    {% if denuncia %}
        <p><a href="{% url 'detalhar_denuncia' protocolo=denuncia.protocolo %}">Cancelar</a></p>
    {% else %}
        <p><a href="{% url 'listar_denuncia' %}">Ver denúncias registradas</a></p>
    {% endif %}
</body>
</html>
